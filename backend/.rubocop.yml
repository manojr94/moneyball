plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "bin/**/*"
    - "vendor/**/*"

# Rails uses double-quoted strings by convention.
Style/StringLiterals:
  Enabled: false

# Not required in Rails 7 and adds noise to scaffolded files.
Style/FrozenStringLiteralComment:
  Enabled: false

# Functional grouping is clearer than strict alphabetical order.
Bundler/OrderedGems:
  Enabled: false

# Rails-generated skeletons (ApplicationRecord, ApplicationMailer, etc.) have no
# meaningful documentation to add; this cop fires on every one of them.
Style/Documentation:
  Enabled: false

# Negative-case specs naturally pair "is invalid" with "has this error message" —
# two expectations that belong together. Cap at 5 to allow setup-heavy integration
# examples without permitting unfocused catch-all tests.
RSpec/MultipleExpectations:
  Max: 5

# Integration specs (e.g. auto-create country on employee save) require enough
# lines to set up realistic state. Cap at 20; anything longer should be split.
RSpec/ExampleLength:
  Max: 20

# Request specs inherit auth helpers (admin, viewer, *_headers) from the outer group,
# so inner groups naturally exceed the default of 5. Cap at 10 to still catch
# genuinely bloated contexts without penalizing realistic integration test setup.
RSpec/MultipleMemoizedHelpers:
  Max: 10
